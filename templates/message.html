<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Privilege Walk</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 16px; min-height: 100vh;
               box-sizing: border-box; display: flex; align-items: center; justify-content: center;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { background: white; padding: 2rem; border-radius: 20px; max-width: 460px; width: 100%; text-align: center;
                box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 1.6rem; margin-top: 0; }
        p { color: #555; line-height: 1.6; }
        a { color: #667eea; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <p><a href="/">Go to the home page</a></p>
    </div>
</body>
</html>
